name: Jest Unit Tests - OrderProcessor

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'order-processor*.js'
      - '.github/workflows/jest-tests.yml'
      - 'package.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'order-processor*.js'
      - '.github/workflows/jest-tests.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Jest tests - OrderProcessor Fixed
        run: npm test -- order-processor.fixed.test.js --verbose
      
      - name: Generate coverage report
        run: npm test -- order-processor.fixed.test.js --coverage
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: jest-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            junit.xml
          retention-days: 30
      
      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('coverage/coverage-final.json') 
              ? 'Coverage report generated successfully' 
              : 'No coverage data available';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Jest Test Results\n\nOrderProcessor Unit Tests: ${testResults}\n\nFor full details, check the workflow run [here](${context.payload.pull_request.html_url}/checks).`
            });
