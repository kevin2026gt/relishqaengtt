name: Playwright E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Part 4/**'
      - '.github/workflows/playwright-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Part 4/**'
      - '.github/workflows/playwright-tests.yml'
  workflow_dispatch:
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install Part 4 dependencies
        run: cd Part\ 4 && npm ci
      
      - name: Install Playwright browsers
        run: cd Part\ 4 && npx playwright install --with-deps
      
      - name: Run Playwright tests - Scenario A (AJAX)
        run: cd Part\ 4 && npm run test:ajax
        continue-on-error: true
      
      - name: Run Playwright tests - Scenario B (Login)
        run: cd Part\ 4 && npm run test:login
        continue-on-error: true
      
      - name: Run Playwright tests - Scenario C (Dynamic Elements)
        run: cd Part\ 4 && npm run test:dynamic
        continue-on-error: true
      
      - name: Generate consolidated report
        if: always()
        run: cd Part\ 4 && npx playwright show-report > /tmp/report.txt 2>&1 || true
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: Part\ 4/playwright-report/
          retention-days: 30
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-test-results
          path: Part\ 4/test-results/
          retention-days: 30
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: Part\ 4/test-results/junit.xml
          check_name: 'Playwright Test Results'
        continue-on-error: true
      
      - name: Comment PR with Playwright results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let scenarioA = 'Unknown', scenarioB = 'Unknown', scenarioC = 'Unknown';
            
            try {
              if (fs.existsSync('Part 4/test-results/junit.xml')) {
                const content = fs.readFileSync('Part 4/test-results/junit.xml', 'utf8');
                const ajaMatch = content.match(/Scenario A[^<]*<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"/);
                const loginMatch = content.match(/Scenario B[^<]*<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"/);
                const dynamicMatch = content.match(/Scenario C[^<]*<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"/);
              }
            } catch (e) {
              console.log('Could not parse test results');
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Playwright E2E Test Results\n\n- **Scenario A (AJAX)**: ${scenarioA}\n- **Scenario B (Login)**: ${scenarioB}\n- **Scenario C (Dynamic)**: ${scenarioC}\n\n📊 Full report available in artifacts → playwright-report`
            });
